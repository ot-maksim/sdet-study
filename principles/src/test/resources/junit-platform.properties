# Parallel execution is switched on, but everything stays sequential by default:
# only classes annotated @Execution(CONCURRENT) run their tests in parallel (see the parallel kata).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# TestNG classes run on the same platform through the TestNG engine (org.junit.support:testng-engine).
# Its parallelism is suite-wide, like parallel="methods" thread-count="4" in testng.xml.
testng.parallel=methods
testng.threadCount=4
testng.dataProviderThreadCount=4
