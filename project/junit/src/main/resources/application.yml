# Defaults of the project. Higher layers (Spring Boot's order): application-<profile>.yml for active profiles,
# environment variables (PROJECT_UI_PROFILE=mobile), system properties (-Dproject.ui.profile=mobile).
# Profiles: stand (connect to a running stand), ci (fail instead of skip), mobile, db — combine them:
#   -Dspring.profiles.active=stand,mobile
spring:
  main:
    banner-mode: off
    # Beans are built on first use: an API test never launches a browser, a UI test never starts a consumer
    lazy-initialization: true

project:
  # containers: Testcontainers starts Postgres, Kafka and the SUT image (hermetic, needs only Docker) | stand: connect
  environment: containers
  # false: environment unavailable → tests skipped with the reason; true (profile ci) → they fail
  require-environment: false
  stand:
    sut-url: http://localhost:7070
    db-url: jdbc:postgresql://localhost:5432/sut
    db-user: sut
    db-password: sut
    # Empty: the stand has no broker, event tests are skipped. Compose with events: localhost:9094 (sut/README.md)
    kafka-bootstrap: ""
  containers:
    postgres-image: postgres:16-alpine
    # The GraalVM build of the broker: starts in ~1 s; the JVM image apache/kafka works the same, slower
    kafka-image: apache/kafka-native:3.9.1
    # Dockerfile + target/sut.jar; relative to the module directory (Surefire's working directory)
    sut-build-dir: ../../sut
  api:
    timeout: 5s
  ui:
    # desktop | mobile (Chromium device emulation)
    profile: desktop
    headless: true
    timeout: 5s
    # Upper bound of browsers = UI tests at the same time; keep junit parallelism <= this
    max-browsers: 4
  events:
    timeout: 10s
  domain:
    # How preconditions create users: api (through the SUT) | db (direct insert)
    user-precondition: api

logging:
  level:
    root: WARN
    com.study: INFO
    org.testcontainers: INFO
    tc: INFO
