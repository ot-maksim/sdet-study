# The test stand: Postgres + the SUT. The framework only connects to it (URLs in its config);
# it does not start or own the environment (see docs/PLAN.md, "Why Testcontainers is not in stage 2").
#
#   mvn -q -pl sut -am package -DskipTests
#   docker compose up -d --build --wait
#   docker compose down -v          # -v drops the data volume
#
# With events (stage 4b): a Kafka broker under the "events" profile, and the SUT told to publish to it.
# A profile only adds services, it cannot change the SUT's environment, hence the variable:
#   SUT_KAFKA_BOOTSTRAP=kafka:19092 docker compose --profile events up -d --build --wait
#   docker compose --profile events down -v
# Tests reach the broker at localhost:9094 (template.stand.kafka-bootstrap).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sut
      POSTGRES_USER: sut
      POSTGRES_PASSWORD: sut
    ports:
      - "5432:5432"          # tests read and seed the database directly (framework/db)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sut -d sut"]
      interval: 2s
      timeout: 2s
      retries: 30

  sut:
    build: ./sut
    environment:
      SUT_PORT: "7070"
      SUT_STORAGE: postgres
      SUT_DB_URL: jdbc:postgresql://postgres:5432/sut
      SUT_DB_USER: sut
      SUT_DB_PASSWORD: sut
      # Empty (default): no events, no broker needed. kafka:19092 with the events profile
      SUT_KAFKA_BOOTSTRAP: ${SUT_KAFKA_BOOTSTRAP:-}
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7070 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Single-node KRaft broker. Two listeners: INTERNAL for the SUT inside the compose network, EXTERNAL for tests
  # on the host. No depends_on from the SUT: it waits for the broker itself when it creates its topic.
  kafka:
    image: apache/kafka-native:3.9.1
    profiles: [events]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The SUT creates its topic; a typo in a topic name must not create an empty one
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"

volumes:
  pgdata:
