# Tests of this module run in parallel: isolation comes from unique data per test (core Unique) and
# a browser leased per test (ui BrowserPool). Keep the parallelism <= template.ui.max-browsers:
# TemplateExtension refuses to start otherwise (a UI test would wait for a browser and time out, far from the cause).
# One JVM (Surefire forkCount=1): a fork would be another Spring context, environment and browser pool.
# A class that must run alone (ReportingTest swaps Allure's global lifecycle) says so with @Isolated.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
